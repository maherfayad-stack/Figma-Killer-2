services:
  - type: web
    name: studio
    runtime: image
    image:
      url: ghcr.io/corebunch/studio:latest
    plan: starter
    numInstances: 1
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: studio-db
          property: connectionString
      - key: UPLOADS_DIR
        value: /app/storage/uploads
      # Every user's projects: must be on the disk below or a redeploy deletes them.
      - key: STUDIO_WORKSPACE_DIR
        value: /app/storage/studio-workspace
      # MCP server secrets and Claude CLI logins: same disk, same reason.
      - key: STUDIO_DATA_DIR
        value: /app/storage/.data
      - key: STATIC_DIR
        value: /app/dist
      # Render auto-injects RENDER_EXTERNAL_URL at runtime; Studio uses it as
      # the CSRF public origin, so no proxy/origin config is needed here.
      - key: STUDIO_SECRET_KEY
        generateValue: true
    disk:
      name: uploads
      mountPath: /app/storage
      sizeGB: 10

databases:
  - name: studio-db
    databaseName: studio
    user: studio
    plan: basic-256mb
    diskSizeGB: 15
    ipAllowList: []
