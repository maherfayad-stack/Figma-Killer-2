name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. a new push to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun run build` is `tsc -b && vite build` — typecheck and bundle in one.
      - name: Build
        run: bun run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun run test` — NOT a bare `bun test`. The script is exactly
      # `bun test --parallel=4`, and `--parallel` implies `--isolate`: worker
      # processes with a fresh global per file, instead of all ~1130 test files
      # sharing one process and one `document`.
      #
      # That is not a speed tweak, it is the correctness model this suite is
      # written against. Two leak classes made bare `bun test` fail ~600 tests
      # in CI that every one of them passes individually:
      #
      #   - a React `act()` scope left open by a timed-out test poisoned every
      #     later render in the process (the ~600-test DOM wipeout);
      #   - `mock.module` is process-global and outlives the file that called
      #     it, so a suite inherited the previous one's module stubs.
      #
      # Developers have always run `bun run test`; CI was the only place
      # running the un-isolated form, which is why `main` never went green.
      - name: Test
        run: bun run test

# NOTE: The Playwright E2E suite is intentionally NOT run in CI yet. As
# configured (`workers: 1`, fully serial, 156 tests) it takes ~45-60 min and is
# timeout-fragile against the un-optimized dev server, so it cannot gate PRs
# reliably today. Run it locally with `bun run test:e2e`. It will be reintroduced
# as its own workflow once the suite is sharded/parallelized and stabilized.
