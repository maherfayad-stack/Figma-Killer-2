name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. a new push to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun run build` is `tsc -b && vite build` — typecheck and bundle in one.
      - name: Build
        run: bun run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No path filter, deliberately: every architecture gate under
      # `src/__tests__/architecture/` — including every new one a work order
      # adds — is picked up by this job automatically. A gate that has to be
      # named here to run is a gate that will be forgotten.
      - name: Test
        run: bun test

  # The FULL Playwright suite is still not run in CI: as configured
  # (`workers: 1`, fully serial, 150+ tests) it takes ~45-60 min and is
  # timeout-fragile against the un-optimized dev server. This job runs the
  # narrow canvas + inspector BUDGET slice instead — the specs that measure
  # computed layout and frame time, which happy-dom structurally cannot answer
  # (`standing-02`). Run the whole suite locally with `bun run test:e2e`.
  e2e-budgets:
    name: Browser budgets (canvas + inspector)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # The stack is NOT started here. `playwright.config.ts`'s `webServer`
      # block starts `bun run e2e:dev` itself, waits up to 300s for the admin
      # origin, sets `VITE_ALLOWED_ORIGIN` for the ports it chose, and relays
      # the stack's output into this job's log — so a failure to boot is
      # readable rather than a bare timeout.
      #
      # This job deliberately uses the DEFAULT path rather than starting the
      # stack by hand and setting `E2E_REUSE_SERVER=1`. CI is the only place
      # that proves `webServer` works on Linux; a job that bypasses it would
      # let the bypass rot into the only thing that works (the shape that hid
      # the Windows `webServer` bug for seven weeks — `verify-01` finding 3).
      #
      # Only paths that exist are passed to Playwright: a path it cannot
      # resolve fails the whole run with "no tests found", so a spec that has
      # not landed yet would turn this job red for the wrong reason. A missing
      # spec costs coverage and says so.
      #
      # `studio-board-perf.e2e.ts` no longer self-skips: its corpus is the
      # committed `studio-workspace/__board-perf-fixture`, so this job measures
      # the canvas mount budgets on every run.
      - name: Run the budget specs
        run: |
          specs=""
          for spec in tests/e2e/studio-board-perf.e2e.ts tests/e2e/inspector-panel-measurement.e2e.ts tests/e2e/inspector-height.e2e.ts tests/e2e/studio-feel.e2e.ts; do
            if [ -f "$spec" ]; then
              specs="$specs $spec"
            else
              echo "::notice::$spec is not in this checkout yet — running without it"
            fi
          done
          if [ -z "$specs" ]; then
            echo "::error::none of the budget specs exist in this checkout"
            exit 1
          fi
          echo "running:$specs"
          bunx playwright test $specs

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .tmp/playwright-report
          retention-days: 7

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            .tmp/playwright-report
            .tmp/playwright-results
            .tmp/e2e-dev.log
          retention-days: 7
          if-no-files-found: warn
