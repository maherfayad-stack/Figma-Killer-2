<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Studio agent capture</title>
    <!--
      The headless capture surface (W4-2A). Deliberately NOT index.html:

        - A React-ONLY import map. The project's own design-system components
          are loaded here the same way the editor loads them: a
          `component-bundle` artefact `import()`ed at runtime, built with
          `react`/`react-dom`/the JSX runtimes EXTERNAL (see
          `server/handlers/studio/componentBundle.ts`). Without these four
          entries that import throws on a bare specifier and every `pkg.*`
          component photographs as a placeholder. They resolve to
          `public/runtime/*.js`, which re-export the page's OWN React off
          `globalThis.__studio` — one React instance, so hooks work.

          index.html's `@studio/*` entries are deliberately NOT here: plugin
          canvas module packs are not loaded on this page and a plugin bundle
          must never execute inside a capture.
        - No loader spinner. Whatever is in <div id="root"> at load time can be
          photographed, so it is empty.
        - No `class="dark"` on <html>. The capture's colour scheme comes from
          the board's own preview axes, applied per frame — inheriting the
          admin's dark chrome here would tint every screen.

      `body { margin: 0 }` because the driver rasterises each frame element by
      itself: any body margin would offset the frames without changing what is
      captured, which is harmless but makes the layout lie about itself.
    -->
    <script type="importmap">
    {
      "imports": {
        "react": "/runtime/react.js",
        "react/jsx-runtime": "/runtime/react-jsx-runtime.js",
        "react/jsx-dev-runtime": "/runtime/react-jsx-dev-runtime.js",
        "react-dom": "/runtime/react-dom.js"
      }
    }
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin/agentCapture/main.tsx"></script>
  </body>
</html>
